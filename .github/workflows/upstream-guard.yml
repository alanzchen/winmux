name: Upstream guard (advisory)

# Manual-only like every hosted workflow in this fork. Advisory until phase 2 of docs/upstream-sync.md:
# it reports upstream-file drift but never fails the run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch upstream AeroSpace base
        run: python3 -B script/upstream-sync.py fetch
      - name: Test the sync tooling
        run: python3 -B script/test_upstream_sync.py
      - name: Guard upstream files (advisory)
        run: python3 -B script/upstream-sync.py guard --advisory
