name: Upstream guard

# Manual-only like every hosted workflow in this fork. Fails when a pristine or hooked upstream file carries an
# unmarked WinMux change (docs/upstream-sync.md).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch upstream AeroSpace base
        run: python3 -B script/upstream-sync.py fetch
      - name: Test the sync tooling
        run: python3 -B script/test_upstream_sync.py
      - name: Guard upstream files
        run: python3 -B script/upstream-sync.py guard
